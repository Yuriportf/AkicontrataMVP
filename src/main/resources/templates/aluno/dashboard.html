<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Painel do Aluno</title></head>
<body>
<div layout:fragment="content">
    <div class="container py-5">

        <div class="mb-4">
            <h2 class="fw-bold">Olá, Aluno 👋</h2>
            <p class="text-muted">Bem-vindo ao seu painel</p>
        </div>

        <div class="row g-4">
            <div class="col-md-3">
                <a th:href="@{/aluno/vagas}" class="text-decoration-none">
                    <div class="card shadow-sm border-0 h-100 text-center p-4">
                        <i class="bi bi-briefcase-fill text-primary" style="font-size: 2.5rem;"></i>
                        <h5 class="mt-3 text-dark">Vagas</h5>
                        <p class="text-muted small mb-0">Explore oportunidades</p>
                    </div>
                </a>
            </div>
            <div class="col-md-3">
                <a th:href="@{/aluno/candidaturas}" class="text-decoration-none">
                    <div class="card shadow-sm border-0 h-100 text-center p-4">
                        <i class="bi bi-clipboard-check-fill text-primary" style="font-size: 2.5rem;"></i>
                        <h5 class="mt-3 text-dark">Candidaturas</h5>
                        <p class="text-muted small mb-0">Suas candidaturas</p>
                    </div>
                </a>
            </div>
            <div class="col-md-3">
                <a th:href="@{/aluno/convites}" class="text-decoration-none">
                    <div class="card shadow-sm border-0 h-100 text-center p-4">
                        <i class="bi bi-envelope-paper-fill text-primary" style="font-size: 2.5rem;"></i>
                        <h5 class="mt-3 text-dark">Convites</h5>
                        <p class="text-muted small mb-0">Convites de entrevista</p>
                    </div>
                </a>
            </div>
            <div class="col-md-3">
                <a th:href="@{/aluno/curriculo}" class="text-decoration-none">
                    <div class="card shadow-sm border-0 h-100 text-center p-4">
                        <i class="bi bi-file-person-fill text-primary" style="font-size: 2.5rem;"></i>
                        <h5 class="mt-3 text-dark">Currículo</h5>
                        <p class="text-muted small mb-0">Gerencie seu currículo</p>
                    </div>
                </a>
            </div>
        </div>

    </div>
</div>
</body>
</html>
