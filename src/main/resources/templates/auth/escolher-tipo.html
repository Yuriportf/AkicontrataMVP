<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Criar conta</title></head>
<body>
<div layout:fragment="content">
    <div class="container py-5">

        <div class="text-center mb-5">
            <i class="bi bi-person-plus-fill text-primary" style="font-size: 3rem;"></i>
            <h2 class="fw-bold mt-2">Criar conta</h2>
            <p class="text-muted">Escolha o tipo de conta que deseja criar</p>
        </div>

        <div class="row justify-content-center g-4">

            <div class="col-md-5">
                <a th:href="@{/auth/cadastro/aluno}" class="text-decoration-none">
                    <div class="card h-100 shadow-sm border-0 text-center p-4 hvr-grow">
                        <i class="bi bi-person-badge-fill text-primary" style="font-size: 3rem;"></i>
                        <h4 class="mt-3 text-dark">Sou Aluno</h4>
                        <p class="text-muted mb-0">
                            Cadastre seu currículo, candidate-se a vagas
                            e participe de processos seletivos.
                        </p>
                    </div>
                </a>
            </div>

            <div class="col-md-5">
                <a th:href="@{/auth/cadastro/empresa}" class="text-decoration-none">
                    <div class="card h-100 shadow-sm border-0 text-center p-4 hvr-grow">
                        <i class="bi bi-building-fill text-primary" style="font-size: 3rem;"></i>
                        <h4 class="mt-3 text-dark">Sou Empresa</h4>
                        <p class="text-muted mb-0">
                            Publique vagas, convide alunos
                            e crie processos seletivos personalizados.
                        </p>
                    </div>
                </a>
            </div>

        </div>

        <p class="text-center text-muted mt-5 mb-0">
            Já tem uma conta?
            <a th:href="@{/login}" class="fw-bold">Entrar</a>
        </p>

    </div>
</div>
</body>
</html>
