<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Cadastro de Empresa</title></head>
<body>
<div layout:fragment="content">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="card shadow border-0">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <i class="bi bi-building-fill text-primary" style="font-size: 3rem;"></i>
                            <h3 class="mt-2 fw-bold">Criar conta de Empresa</h3>
                            <p class="text-muted mb-0">Publique vagas, convide alunos e crie processos seletivos</p>
                        </div>
                        <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
                        <form th:action="@{/auth/cadastro}" method="post">
                            <input type="hidden" name="tipoUsuario" value="EMPRESA">
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">Email corporativo</label>
                                <input type="email" id="email" name="email"
                                       class="form-control form-control-lg"
                                       placeholder="contato@empresa.com" required>
                            </div>
                            <div class="mb-4">
                                <label for="senha" class="form-label fw-semibold">Senha</label>
                                <input type="password" id="senha" name="senha"
                                       class="form-control form-control-lg"
                                       placeholder="Mínimo 4 caracteres"
                                       minlength="4" required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="bi bi-check-circle-fill"></i> Criar conta da empresa
                                </button>
                            </div>
                        </form>
                    </div>
                    <div class="card-footer bg-light text-center py-4 border-0">
                        <p class="mb-2 text-muted">Já tem uma conta?</p>
                        <a th:href="@{/login}" class="btn btn-outline-primary btn-lg w-100">
                            <i class="bi bi-box-arrow-in-right"></i> Entrar na minha conta
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
