<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Cadastro de Aluno</title></head>
<body>

<div layout:fragment="content">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-9">

                <div class="card shadow border-0">
                    <div class="card-body p-4 p-md-5">

                        <div class="text-center mb-4">
                            <i class="bi bi-person-badge-fill text-primary" style="font-size: 3rem;"></i>
                            <h3 class="mt-2 fw-bold">Criar conta de Aluno</h3>
                            <p class="text-muted mb-0">Preencha seus dados para começar</p>
                        </div>

                        <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

                        <form th:action="@{/auth/cadastro/aluno}" method="post">

                            <!-- ETAPA 1 — Credenciais -->
                            <h5 class="mb-3"><span class="badge bg-primary">1</span> Acesso</h5>

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label for="email" class="form-label fw-semibold">Email *</label>
                                    <input type="email" id="email" name="email"
                                           class="form-control form-control-lg"
                                           placeholder="seu@email.com" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="senha" class="form-label fw-semibold">Senha *</label>
                                    <input type="password" id="senha" name="senha"
                                           class="form-control form-control-lg"
                                           placeholder="Mínimo 4 caracteres"
                                           minlength="4" required>
                                </div>
                            </div>

                            <!-- ETAPA 2 — Dados pessoais -->
                            <h5 class="mb-3"><span class="badge bg-primary">2</span> Dados pessoais</h5>

                            <div class="row g-3 mb-4">
                                <div class="col-md-8">
                                    <label for="nomeCompleto" class="form-label fw-semibold">Nome completo *</label>
                                    <input type="text" id="nomeCompleto" name="nomeCompleto"
                                           class="form-control" required>
                                </div>
                                <div class="col-md-4">
                                    <label for="cpf" class="form-label fw-semibold">CPF *</label>
                                    <input type="text" id="cpf" name="cpf"
                                           class="form-control"
                                           placeholder="000.000.000-00" required>
                                </div>
                                <div class="col-md-4">
                                    <label for="dataNascimento" class="form-label fw-semibold">Data de nascimento *</label>
                                    <input type="date" id="dataNascimento" name="dataNascimento"
                                           class="form-control" required>
                                </div>
                                <div class="col-md-4">
                                    <label for="telefone" class="form-label fw-semibold">Telefone</label>
                                    <input type="text" id="telefone" name="telefone"
                                           class="form-control"
                                           placeholder="(00) 00000-0000">
                                </div>
                            </div>

                            <!-- ETAPA 3 — Dados acadêmicos -->
                            <h5 class="mb-3"><span class="badge bg-primary">3</span> Dados acadêmicos</h5>

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label for="tipoAluno" class="form-label fw-semibold">Tipo de curso *</label>
                                    <select id="tipoAluno" name="tipoAluno" class="form-select" required>
                                        <option value="">Selecione...</option>
                                        <option value="TECNICO">Técnico</option>
                                        <option value="SUPERIOR">Superior</option>
                                        <option value="POS_GRADUACAO">Pós-graduação</option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label for="cursoId" class="form-label fw-semibold">Curso *</label>
                                    <select id="cursoId" name="cursoId" class="form-select" required>
                                        <option value="">Selecione o tipo primeiro</option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label for="campusId" class="form-label fw-semibold">Campus *</label>
                                    <select id="campusId" name="campusId" class="form-select" required>
                                        <option value="">Selecione o curso primeiro</option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label for="matricula" class="form-label fw-semibold">Matrícula *</label>
                                    <input type="text" id="matricula" name="matricula"
                                           class="form-control" required>
                                </div>

                                <div class="col-md-4">
                                    <label for="periodo" class="form-label fw-semibold">Período *</label>
                                    <select id="periodo" name="periodo" class="form-select" required>
                                        <option value="">Selecione...</option>
                                        <option value="MATUTINO">Matutino</option>
                                        <option value="VESPERTINO">Vespertino</option>
                                        <option value="NOTURNO">Noturno</option>
                                        <option value="INTEGRAL">Integral</option>
                                    </select>
                                </div>

                                <div class="col-md-4">
                                    <label for="dataInicio" class="form-label fw-semibold">Início do curso *</label>
                                    <input type="date" id="dataInicio" name="dataInicio"
                                           class="form-control" required>
                                </div>

                                <div class="col-md-4">
                                    <label for="dataPrevisaoFim" class="form-label fw-semibold">Previsão de término</label>
                                    <input type="date" id="dataPrevisaoFim" name="dataPrevisaoFim"
                                           class="form-control">
                                </div>
                            </div>

                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="bi bi-check-circle-fill"></i> Criar minha conta
                                </button>
                            </div>

                        </form>

                    </div>

                    <div class="card-footer bg-light text-center py-4 border-0">
                        <p class="mb-2 text-muted">Já tem uma conta?</p>
                        <a th:href="@{/login}" class="btn btn-outline-primary btn-lg w-100">
                            <i class="bi bi-box-arrow-in-right"></i> Entrar na minha conta
                        </a>
                    </div>

                </div>

            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
<script>
    // Quando o tipoAluno mudar, busca os cursos via AJAX
    document.getElementById('tipoAluno').addEventListener('change', function () {
        const tipo = this.value;
        const cursoSelect = document.getElementById('cursoId');
        const campusSelect = document.getElementById('campusId');

        cursoSelect.innerHTML = '<option value="">Carregando...</option>';
        campusSelect.innerHTML = '<option value="">Selecione o curso primeiro</option>';

        if (!tipo) return;

        fetch('/cursos/api?tipo=' + tipo)
            .then(r => r.json())
            .then(cursos => {
                cursoSelect.innerHTML = '<option value="">Selecione...</option>';
                cursos.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.id;
                    opt.textContent = c.nome;
                    cursoSelect.appendChild(opt);
                });
            })
            .catch(() => {
                cursoSelect.innerHTML = '<option value="">Erro ao carregar</option>';
            });
    });

    // Quando o curso mudar, busca os campus via AJAX
    document.getElementById('cursoId').addEventListener('change', function () {
        const cursoId = this.value;
        const campusSelect = document.getElementById('campusId');

        campusSelect.innerHTML = '<option value="">Carregando...</option>';

        if (!cursoId) return;

        fetch('/cursos/' + cursoId + '/campus')
            .then(r => r.json())
            .then(campi => {
                campusSelect.innerHTML = '<option value="">Selecione...</option>';
                campi.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.id;
                    opt.textContent = c.nome;
                    campusSelect.appendChild(opt);
                });
            })
            .catch(() => {
                campusSelect.innerHTML = '<option value="">Erro ao carregar</option>';
            });
    });
</script>
</th:block>

</body>
</html>
