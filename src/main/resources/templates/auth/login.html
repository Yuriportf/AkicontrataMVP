<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Entrar</title>
</head>
<body>

<div layout:fragment="content">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">

                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">

                        <h3 class="text-center mb-4">
                            <i class="bi bi-box-arrow-in-right"></i> Entrar
                        </h3>

                        <!-- Mensagem de erro -->
                        <div th:if="${param.error}" class="alert alert-danger">
                            <i class="bi bi-exclamation-triangle"></i>
                            Email ou senha inválidos.
                        </div>

                        <!-- Mensagem de logout -->
                        <div th:if="${param.logout}" class="alert alert-success">
                            <i class="bi bi-check-circle"></i>
                            Você saiu com sucesso.
                        </div>

                        <!-- Mensagem de cadastro -->
                        <div th:if="${mensagem}" class="alert alert-info" th:text="${mensagem}"></div>

                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label">Email</label>
                                <input type="email" id="username" name="username"
                                       class="form-control" required autofocus>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Senha</label>
                                <input type="password" id="password" name="password"
                                       class="form-control" required>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    Entrar
                                </button>
                            </div>
                        </form>

                        <hr class="my-4">

                        <p class="text-center text-muted mb-2">Não tem conta?</p>
                        <div class="d-flex gap-2 justify-content-center">
                            <a th:href="@{/auth/cadastro/aluno}" class="btn btn-outline-primary btn-sm">
                                Sou Aluno
                            </a>
                            <a th:href="@{/auth/cadastro/empresa}" class="btn btn-outline-primary btn-sm">
                                Sou Empresa
                            </a>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

</body>
</html>
